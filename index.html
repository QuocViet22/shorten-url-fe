<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZipLink</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>

<body>
    <div class="container">
        <h1>ZipLink</h1>
        <div id="main-form">
            <p style="margin-bottom: 1.5rem; color: #94a3b8;">Shorten a URL or pick from history</p>
            <input type="url" id="url-input" placeholder="https://example.com" required />
            <button id="shorten-btn" onclick="handleShorten()">ShortenURL</button>
            <div id="loader" class="hidden">Loading&hellip;</div>
        </div>
        <div id="result-display" class="hidden">
            <div class="result-view">
                <span id="generated-link"></span>
            </div>
            <button onclick="backToInput()" style="background: transparent; color: #94a3b8; border: 1px solid #334155;">
                Shorten Another
            </button>
        </div>
    </div>
    <div class="history-container" id="history-section">
        <span class="history-title">Recent Links</span>
        <div id="history-list"></div>
    </div>

    <div id="qr-modal" class="modal hidden" onclick="if(event.target===this) closeQRModal()">
        <div class="modal-content">
            <h2>QR Code</h2>
            <div id="qr-code-display"></div>
            <button id="qr-download" onclick="downloadQRCode()">Download PNG</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <script>
        const STORAGE_KEY = 'ziplink_cache'; // Load history on page start 
        let currentQRCodeLink = '';
        window.onload = renderHistory;

        function setLoading(isLoading) {
            const btn = document.getElementById('shorten-btn');
            const loader = document.getElementById('loader');
            if (!btn || !loader) return;

            if (isLoading) {
                btn.disabled = true;
                loader.classList.remove('hidden');
            } else {
                btn.disabled = false;
                btn.textContent = 'ShortenURL';
                loader.classList.add('hidden');
            }
        }

        function handleShorten() {
            let longUrl = document.getElementById('url-input').value.trim();
            if (!longUrl)
                return;

            // Clean the URL: add https:// if no protocol
            if (!longUrl.startsWith('http://') && !longUrl.startsWith('https://')) {
                alert('Please enter a valid URL.');
                return;
            }

            const cache = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            // 1. Check Cache 
            const existing = cache.find(item => item.long === longUrl);
            if (existing) {
                showResult(existing.short);
                return;
            }

            // 2. Fetch API to shorten URL
            setLoading(true);
            fetch('https://ziplink.viethq.tech/api/url', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ longUrl })
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    const shortUrl = data.shortUrl; // Assuming the API returns { shortUrl: "..." }
                    // 3. Save to Cache 
                    cache.unshift({ long: longUrl, short: shortUrl });
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(cache));
                    showResult(shortUrl);
                    renderHistory();
                })
                .catch(error => {
                    alert('Error shortening URL: ' + error.message);
                })
                .finally(() => {
                    setLoading(false);
                });
        }

        function renderHistory() {
            const cache = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const listElement = document.getElementById('history-list');
            if (cache.length === 0) {
                listElement.innerHTML = '<p style="color: #475569; font-size: 0.8rem;">No recent links yet.</p>';
                return;
            }
            listElement.innerHTML = cache.map(item => {
                const longDisplay = truncateUrlDisplay(item.long, 100);
                const shortDisplay = truncateUrlDisplay(item.short, 40);
                return `
        <div class="history-item">
            <div class="history-info">
                <span class="long" title="${item.long}">${longDisplay}</span>
                <span class="short" title="${item.short}">${shortDisplay}</span>
            </div>
            <div>
                <button class="copy-small" onclick="copyToClipboard('${item.short}')">Copy</button>
                <button class="copy-small" onclick="generateQRCode('${item.short}')">QR</button>
            </div>
        </div>`;
            }).join('');
        }

        function truncateUrlDisplay(url, maxLength = 100) {
            if (url.length <= maxLength) return url;
            const prefix = url.slice(0, Math.max(8, maxLength - 8));
            return `${prefix}....`;
        }

        function showResult(url) {
            document.getElementById('main-form').classList.add('hidden');
            document.getElementById('result-display').classList.remove('hidden');
            const display = truncateUrlDisplay(url, 40);
            const linkEl = document.getElementById('generated-link');
            linkEl.innerHTML = `<a href="${url}" target="_blank" rel="noreferrer noopener" title="${url}">${display}</a>`;
        }

        function generateQRCode(url) {
            currentQRCodeLink = url || '';
            const modal = document.getElementById('qr-modal');
            const display = document.getElementById('qr-code-display');
            display.innerHTML = '';

            if (!currentQRCodeLink) {
                display.innerText = 'Invalid URL';
                return;
            }

            new QRCode(display, {
                text: currentQRCodeLink,
                width: 180,
                height: 180,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });

            modal.classList.remove('hidden');
        }

        function closeQRModal() {
            const modal = document.getElementById('qr-modal');
            modal.classList.add('hidden');
        }

        function downloadQRCode() {
            const display = document.getElementById('qr-code-display');
            const img = display.querySelector('img');
            const canvas = display.querySelector('canvas');

            let dataUrl;
            if (img && img.src) {
                dataUrl = img.src;
            } else if (canvas) {
                dataUrl = canvas.toDataURL('image/png');
            }

            if (!dataUrl) {
                alert('QR code not ready yet.');
                return;
            }

            const anchor = document.createElement('a');
            anchor.href = dataUrl;
            anchor.download = `ziplink-qrcode-${Date.now()}.png`;
            anchor.click();
        }

        function backToInput() {
            document.getElementById('main-form').classList.remove('hidden');
            document.getElementById('result-display').classList.add('hidden');
            document.getElementById('url-input').value = '';
        }

        function copyToClipboard(text) {
            if (!text) return;
            navigator.clipboard.writeText(text);
            alert('Link copied!');
        }
    </script>
</body>

</html>
